<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Chrono Évolutif - 2004</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; text-align: center; background: #f0f2f5; padding: 40px 20px; color: #333; }
        .quiz-container { background: white; padding: 40px; border-radius: 12px; max-width: 650px; margin: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        .progress { font-size: 14px; color: #666; font-weight: bold; margin-bottom: 10px; }
        h2 { font-size: 24px; color: #2c3e50; min-height: 68px; margin-bottom: 10px; }
        #timer { font-size: 28px; font-weight: bold; color: #e74c3c; margin: 10px 0; background: #fde8e7; display: inline-block; padding: 5px 20px; border-radius: 20px; }
        .indicators-container { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; font-weight: bold; font-size: 16px; line-height: 1.4; }
        #points-indicator { color: #27ae60; }
        #penalty-indicator { color: #c0392b; }
        .answers-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        .btn-answer { display: block; width: 100%; padding: 16px; font-size: 16px; font-weight: 600; border: 2px solid #3498db; border-radius: 8px; cursor: pointer; background: white; color: #3498db; transition: all 0.2s ease; }
        .btn-answer:hover { background: #3498db; color: white; }
        .btn-answer.hidden { visibility: hidden; pointer-events: none; }
        #quiz-screen { display: none; }
        .btn-action { padding: 15px 30px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; border: none; margin-top: 10px; text-transform: uppercase; }
        .btn-start { background: #3498db; color: white; }
        .input-group { margin: 20px 0 10px 0; }
        .input-name { padding: 12px; font-size: 16px; width: 80%; max-width: 300px; border: 2px solid #ccc; border-radius: 6px; text-align: center; }
        .input-name:focus { border-color: #3498db; outline: none; }
        .leaderboard-section { margin-top: 35px; border-top: 2px dashed #e0e0e0; padding-top: 20px; }
        .results-table { width: 100%; max-width: 640px; margin: 15px auto 0 auto; border-collapse: collapse; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; table-layout: fixed; }
        .results-table th, .results-table td { padding: 8px 4px; text-align: center; border: 1px solid #dddddd; }
        .results-table th { background-color: #2c3e50; color: white; font-weight: 600; font-size: 10px; line-height: 1.2; white-space: normal; padding: 7px 3px; }
        .results-table td { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .col-joueur { width: 26%; }
        .col-stat { width: 24%; }
        .col-score { width: 26%; }
        .results-table tr:nth-child(even) { background-color: #f8f9fa; }
        .results-table tr { border-bottom: 1px solid #dddddd; }
        .text-success { color: #27ae60; font-weight: bold; }
        .text-danger { color: #c0392b; font-weight: bold; }
        .current-player-row { background-color: #e8f4fd !important; font-weight: bold; }
        .reference-row { background-color: #fff3cd !important; font-weight: bold; }
        .secret-trigger { pointer-events: auto; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="start-screen">
        <h2>Thème : 2004 !</h2>
        <div class="input-group">
            <input type="text" id="player-name" class="input-name" placeholder="Entrez votre nom / pseudo" autocomplete="off">
        </div>
        <button class="btn-action btn-start" onclick="validateAndStart()">Démarrer le jeu</button>

        <div class="leaderboard-section">
            <h2 class="secret-trigger" onclick="handleSecretClick()">Classement Général</h2>
            <table class="results-table">
                <thead>
                    <tr>
                        <th class="col-joueur">Joueur</th>
                        <th class="col-stat">Bonnes<br>réponses</th>
                        <th class="col-stat">Mauvaises<br>réponses</th>
                        <th class="col-score">Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <div id="quiz-screen">
        <audio id="quiz-audio" preload="auto"></audio>
        <div class="progress" id="progress">Question 1</div>
        <h2 id="question-text">Chargement de la question...</h2>
        <div id="timer">30s</div>
        <div class="indicators-container">
            <div id="points-indicator">Si juste :<br>+600 pts</div>
            <div id="penalty-indicator">Si faux :<br>-90 pts</div>
        </div>
        <div class="answers-grid" id="answers-container"></div>
    </div>
</div>

<script>
    const myQuestions = new Array(
        {
            question: "1 - Qui chante sur ce titre ?",
            audioSrc: "Chimene Badi.mp3",
             answers: new Array(
                { text: "Chimène Badi", isCorrect: true },
                { text: "Amel Bent", isCorrect: false },
                { text: "Julie Zenatti", isCorrect: false },
                { text: "Nolwenn Leroy", isCorrect: false }
            )
        },
{
            question: "2 - Qui chante sur ce titre ?",
            audioSrc: "Gwen Stefani.mp3",
             answers: new Array(
                { text: "Gwen Stefani", isCorrect: true },
                { text: "Pink", isCorrect: false },
                { text: "Nelly Furtado", isCorrect: false },
                { text: "Fergie", isCorrect: false }
            )
        },
{
            question: "3 - Qui chante sur ce titre ?",
            audioSrc: "Luke.mp3",
             answers: new Array(
                { text: "Luke", isCorrect: true },
                { text: "Cali", isCorrect: false },
                { text: "Mickey 3D", isCorrect: false },
                { text: "Dionysos", isCorrect: false }
            )
        },
{
            question: "4 - Qui chante sur ce titre ?",
            audioSrc: "Akon.mp3",
             answers: new Array(
                { text: "Akon", isCorrect: true },
                { text: "Ne-Yo", isCorrect: false },
                { text: "Chris Brown", isCorrect: false },
                { text: "T-Pain", isCorrect: false }
            )
        },
{
            question: "5 - Qui chante sur ce titre ?",
            audioSrc: "Priscilla.mp3",
             answers: new Array(
                { text: "Priscilla", isCorrect: true },
                { text: "Jenifer", isCorrect: false },
                { text: "Lorie", isCorrect: false },
                { text: "Leslie", isCorrect: false }
            )
        },
{
            question: "6 - Qui chante sur ce titre ?",
            audioSrc: "Simple Plan.mp3",
             answers: new Array(
                { text: "Simple Plan", isCorrect: true },
                { text: "Sum 41", isCorrect: false },
                { text: "Yellowcard", isCorrect: false },
                { text: "Greenday", isCorrect: false }
            )
        },
{
            question: "7 - Qui chante sur ce titre ?",
            audioSrc: "Rohff.mp3",
             answers: new Array(
                { text: "Rohff", isCorrect: true },
                { text: "Booba", isCorrect: false },
                { text: "Kaaris", isCorrect: false },
                { text: "Alonzo", isCorrect: false }
            )
        },
{
            question: "8 - Quel est le titre de cette chanson ?",
            audioSrc: "Gérald De Palmas.mp3",
             answers: new Array(
                { text: "Elle habite ici", isCorrect: true },
                { text: "Tomber", isCorrect: false },
                { text: "Une seule vie", isCorrect: false },
                { text: "J'en rêve encore", isCorrect: false }
            )
        },
{
            question: "9 - Qui chante sur ce titre ?",
            audioSrc: "Ashlee Simpson.mp3",
             answers: new Array(
                { text: "Ashlee Simpson", isCorrect: true },
                { text: "Avril Lavigne", isCorrect: false },
                { text: "Kelly Clarkson", isCorrect: false },
                { text: "Hilary Duff", isCorrect: false }
            )
        },
{
            question: "10 - Quel est le titre de cette chanson (ralenti) ?",
            audioSrc: "Jenifer.mp3",
             answers: new Array(
                { text: "Ma révolution", isCorrect: true },
                { text: "J'attends l'amour", isCorrect: false },
                { text: "Au soleil", isCorrect: false },
                { text: "Donne-moi le temps", isCorrect: false }
            )
        },
{
            question: "11 - Qui chante sur ce titre ?",
            audioSrc: "Slipknot.mp3",
             answers: new Array(
                { text: "Slipknot", isCorrect: true },
                { text: "Korn", isCorrect: false },
                { text: "Disturbed", isCorrect: false },
                { text: "Mudvayne", isCorrect: false }
            )
        },
{
            question: "12 - Qui chante sur ce titre ?",
            audioSrc: "Amel Bent.mp3",
             answers: new Array(
                { text: "Amel Bent", isCorrect: true },
                { text: "Vitaa", isCorrect: false },
                { text: "Shy'm", isCorrect: false },
                { text: "Sheryfa Luna", isCorrect: false }
            )
        },
        {
            question: "13 - Quel est le titre de cette chanson ?",
            audioSrc: "Destinys Child.mp3",
             answers: new Array(
                { text: "Lose my breath", isCorrect: true },
                { text: "Bootylicious", isCorrect: false },
                { text: "Independant woman", isCorrect: false },
                { text: "Survivor", isCorrect: false }
            )
        },
        {
            question: "14 - Qui chante sur ce titre ?",
            audioSrc: "Daddy Yankee.mp3",
             answers: new Array(
                { text: "Daddy Yankee", isCorrect: true },
                { text: "Don Omar", isCorrect: false },
                { text: "Nicky Jam", isCorrect: false },
                { text: "Tego Calderon", isCorrect: false }
            )
        }
    );

    const REFERENCE_SCORE = {
        id: 'ref-LIGATEAM',
        name: "LIGATEAM",
        correct: 14,
        wrong: 0,
        score: 6422,
        isReference: true
    };

    const STORAGE_KEY = 'quizLeaderboard_2004';
    let playerName = "";
    let currentQuestionIndex = 0;
    let totalScore = 0;
    let correctAnswersCount = 0;
    let wrongAnswersCount = 0;
    let seconds = 30;
    let currentQuestionValue = 600;
    let currentPenaltyValue = -90;
    let timerInterval = null;
    let wrongAnswersElements = new Array();
    let secretClickCount = 0;
    let isGameActive = false;
    const SECRET_PASSWORD = "admin123";

    window.onload = function() {
        showLeaderboardData(null);
    };

    window.onbeforeunload = function() {
        if (isGameActive && playerName !== "") {
            isGameActive = false;
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || new Array();
            history.push({
                id: Date.now(),
                name: playerName + " (Abandon)",
                correct: correctAnswersCount,
                wrong: wrongAnswersCount,
                score: totalScore
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }
    };

    function validateAndStart() {
        const nameInput = document.getElementById('player-name').value.trim();
        if (nameInput === "") {
            alert("Veuillez renseigner votre nom avant de commencer la partie.");
            return;
        }
        playerName = nameInput;
        startGame();
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        currentQuestionIndex = 0;
        totalScore = 0;
        correctAnswersCount = 0;
        wrongAnswersCount = 0;
        secretClickCount = 0;
        isGameActive = true;
        loadQuestion();
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        seconds = 30;
        currentQuestionValue = 600;
        currentPenaltyValue = -90;
        document.getElementById('timer').innerText = "30s";
        updateDisplays();

        if (currentQuestionIndex >= myQuestions.length) {
            saveGameAndEnd();
            return;
        }

        const currentQuestion = myQuestions.slice(currentQuestionIndex, currentQuestionIndex + 1).shift();
        const audio = document.getElementById('quiz-audio');
        if (audio && currentQuestion.audioSrc) {
            audio.src = currentQuestion.audioSrc;
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.log("Lecture audio bloquée ou absente :", error);
            });
        }

        document.getElementById('progress').innerText = "Question " + (currentQuestionIndex + 1) + " / " + myQuestions.length;
        document.getElementById('question-text').innerText = currentQuestion.question;

        const container = document.getElementById('answers-container');
        container.innerHTML = '';
        wrongAnswersElements = new Array();

        const shuffledAnswers = currentQuestion.answers.slice().sort(function() {
            return 0.5 - Math.random();
        });

        shuffledAnswers.forEach(function(answer) {
            const button = document.createElement('button');
            button.className = 'btn-answer';
            button.innerText = answer.text;
            if (answer.isCorrect) {
                button.setAttribute('data-correct', 'true');
            } else {
                wrongAnswersElements.push(button);
            }
            button.onclick = function() {
                handleAnswer(button, answer.isCorrect, false);
            };
            container.appendChild(button);
        });

        timerInterval = setInterval(function() {
            seconds--;
            let elapsedSeconds = 30 - seconds;
            currentQuestionValue = Math.max(300, 600 - (elapsedSeconds * 10));
            currentPenaltyValue = Math.min(-30, -90 + (elapsedSeconds * 2));
            document.getElementById('timer').innerText = seconds + "s";
            updateDisplays();

            if (elapsedSeconds === 11 && wrongAnswersElements.length > 0) {
                removeRandomWrongAnswer();
            }
            if (elapsedSeconds === 22 && wrongAnswersElements.length > 0) {
                removeRandomWrongAnswer();
            }
            if (seconds <= 0) {
clearInterval(timerInterval);
handleAnswer(null, false, true);
}
}, 1000);
}
function removeRandomWrongAnswer() {
const randomIndex = Math.floor(Math.random() * wrongAnswersElements.length);
const removedButton = wrongAnswersElements.splice(randomIndex, 1).shift();
if (removedButton) {
removedButton.classList.add('hidden');
}
}
function updateDisplays() {
const br = "<" + "br>";
document.getElementById('points-indicator').innerHTML = "Si juste :" + br + "+" + currentQuestionValue + " pts";
document.getElementById('penalty-indicator').innerHTML = "Si faux :" + br + currentPenaltyValue + " pts";
}
function handleAnswer(selectedButton, isCorrect, isTimeOut) {
clearInterval(timerInterval);
const audio = document.getElementById('quiz-audio');
if (audio) {
try { audio.pause(); } catch(e) {}
}
if (isTimeOut) {
totalScore += -100;
wrongAnswersCount++;
} else if (isCorrect) {
totalScore += currentQuestionValue;
correctAnswersCount++;
if (selectedButton) selectedButton.style.background = "#2ecc71";
} else {
totalScore += currentPenaltyValue;
wrongAnswersCount++;
if (selectedButton) selectedButton.style.background = "#e74c3c";
}
const buttons = document.querySelectorAll('.btn-answer');
buttons.forEach(function(btn) {
btn.disabled = true;
if (btn.getAttribute('data-correct') === 'true') {
btn.style.background = "#2ecc71";
btn.style.color = "white";
}
});
setTimeout(function() {
currentQuestionIndex++;
loadQuestion();
}, 2000);
}
function saveGameAndEnd() {
isGameActive = false;
let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || new Array();
const currentGameData = {
id: Date.now(),
name: playerName,
correct: correctAnswersCount,
wrong: wrongAnswersCount,
score: totalScore
};
history.push(currentGameData);
localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
document.getElementById('player-name').value = "";
document.getElementById('quiz-screen').style.display = 'none';
document.getElementById('start-screen').style.display = 'block';
showLeaderboardData(currentGameData.id);
}
function showLeaderboardData(activeId) {
let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || new Array();
let allScores = new Array(REFERENCE_SCORE).concat(history);
allScores.sort(function(a, b) { return b.score - a.score; });
const tbody = document.getElementById('leaderboard-body');
tbody.innerHTML = "";
allScores.forEach(function(player) {
const row = tbody.insertRow();
if (player.isReference) {
row.className = "reference-row";
} else if (activeId && player.id === activeId) {
row.className = "current-player-row";
}
const cellNom = row.insertCell(0);
const cellCorrect = row.insertCell(1);
const cellWrong = row.insertCell(2);
const cellScore = row.insertCell(3);
cellNom.innerText = player.name;
cellCorrect.innerText = player.correct;
cellCorrect.className = "text-success";
cellWrong.innerText = player.wrong;
cellWrong.className = "text-danger";
cellScore.innerText = player.score + " pts";
cellScore.style.fontWeight = "bold";
cellScore.style.color = player.isReference ? "#d35400" : "#2ecc71";
});
}
function handleSecretClick() {
secretClickCount++;
if (secretClickCount === 5) {
secretClickCount = 0;
const passwordInput = prompt("Entrez le mot de passe administrateur pour réinitialiser les scores :");
if (passwordInput === SECRET_PASSWORD) {
localStorage.removeItem(STORAGE_KEY);
showLeaderboardData(null);
alert("Historique des scores effacé !");
} else if (passwordInput !== null) {
alert("Mot de passe incorrect.");
}
}
}
</script>
</body>
</html>
